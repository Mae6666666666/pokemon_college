<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body> 
    <header class="header-box">
        <h1 class="underlining">Pika Observer</h1>
    </header>
    <main>
        <form  action="{{ url_for('signup') }}" method="post" class="info-box">
            <h1>Signup</h1>
            <input name="username" class="form-input" type="text" placeholder="Create a username">
            <input name="password" class="form-input" type="password" placeholder="Create password">
            <button type="submit">Sign Up</button>
        </form>

        <div class="create-account">
            <p>
                Have an account? 
                <a href="login.html">Log In</a>
                here!
            </p>
        </div>
         <a href="homepage.html">home</a>
    </main>
    

    <footer>
        <p>
            Need help? contact our support page at: <a href="test@icloud.com">HelpLine@test.com</a>
        </p>
    </footer>

</body>
</html>
