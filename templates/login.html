<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" >
</head>
<body> 
    <header class="header-box">
        <h1 class="underlining">Pika Observer</h1>
    </header>

    <main>
        <div class="info-box">
            <h1>Login</h1>
            <form action="{{ url_for('login') }}" method="post">
                <input id="username" name="username" class="form-input" type="text" placeholder="Please enter username">
                <input id="password" name="password" class="form-input" type="password" placeholder="Enter password">
                <button type="submit">Login</button>
            </form>
        </div>

        <div class="create-account">
            <p>
                Don't have an account? 
                <a href="{{ url_for('signup') }}">Sign Up</a>
                here!
            </p>
        
        </div>

        
    </main>
    
    <footer>
        <p>
            Need help? contact our support page at: <a href="mailto:test@icloud.com">HelpLine@test.com</a>
        </p>
    </footer>

</body>
</html>
